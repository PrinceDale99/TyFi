[package]
name = "smart_wallet"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "TyFi seedless smart wallet: a Soroban custom account authorized by WebAuthn secp256r1 passkeys"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27.0.0-rc.1"
serde = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = { version = "0.7", default-features = false }

[dev-dependencies]
soroban-sdk = { version = "27.0.0-rc.1", features = ["testutils"] }
# Test-only: produce real secp256r1 WebAuthn assertions (no mocked crypto).
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha2 = { version = "0.10", default-features = false }
