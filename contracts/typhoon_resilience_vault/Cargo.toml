[package]
name = "typhoon_resilience_vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "27.0.0-rc.1"

[dev-dependencies]
soroban-sdk = { version = "27.0.0-rc.1", features = ["testutils"] }
derive_arbitrary = "=1.3.2"
# Used by integration tests (tests/) to produce real ed25519 signatures
# over the contract's canonical signed-message format without any mocking.
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core"] }
sha2 = { version = "0.10", default-features = false }
rand = { version = "0.8", features = ["std"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
panic = "abort"
lto = true
codegen-units = 1
