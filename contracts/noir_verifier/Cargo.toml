[package]
name = "noir_verifier"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "On-chain UltraHonk verifier for the TyFi Noir weather circuit"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# soroban-sdk 28 (protocol 28+), unlike the vault's 27, because the verifier
# needs the BN254 scalar-field and MSM host functions. Hence its own workspace.
soroban-sdk = { version = "28.0.0", features = ["alloc"] }
ultrahonk_soroban_verifier = { version = "0.1.0", default-features = false }

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils", "alloc"] }

# Standalone workspace: keeps soroban-sdk 28 out of the main contracts workspace.
[workspace]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
