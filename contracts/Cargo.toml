[workspace]
resolver = "2"
members = ["smart_wallet", "smart_wallet_factory", "tyfi_dao", "typhoon_resilience_vault"]
# Built on its own: needs soroban-sdk 28 (see noir_verifier/Cargo.toml).
exclude = ["noir_verifier"]

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.test]
debug = 0
strip = "debuginfo"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true




